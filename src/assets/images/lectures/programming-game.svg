<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Programming game</title>
  <desc id="desc">A local vector cover for learning programming through games.</desc>
  <rect width="1200" height="680" fill="#090b10"/>
  <rect x="80" y="80" width="1040" height="520" rx="18" fill="#121722" stroke="#18f2b2" stroke-width="6"/>
  <rect x="105" y="115" width="470" height="445" fill="#060a10" stroke="#2a3548" stroke-width="3"/>
  <rect x="625" y="115" width="470" height="445" fill="#07131f" stroke="#2a3548" stroke-width="3"/>
  <g font-family="Consolas,monospace" font-size="29">
    <text x="135" y="175" fill="#18f2b2">if (hero.HasKey)</text>
    <text x="160" y="220" fill="#f4f7fb">{ openDoor(); }</text>
    <text x="135" y="285" fill="#ff4fd8">for (wave = 0; wave &lt; 3; wave++)</text>
    <text x="160" y="330" fill="#f4f7fb">{ spawnEnemy(); }</text>
    <text x="135" y="395" fill="#ffd166">score += combo * 100;</text>
  </g>
  <g transform="translate(710 205)">
    <rect x="0" y="0" width="270" height="270" fill="#102033" stroke="#18f2b2" stroke-width="4"/>
    <path d="M0 90h270M0 180h270M90 0v270M180 0v270" stroke="#263a53" stroke-width="4"/>
    <rect x="105" y="105" width="60" height="60" fill="#ff4fd8"/>
    <circle cx="225" cy="45" r="26" fill="#ffd166"/>
    <path d="M35 220h58v20H35z" fill="#18f2b2"/>
  </g>
  <text x="860" y="530" fill="#e8fff8" font-family="Consolas,monospace" font-size="34" text-anchor="middle">CODE BECOMES ACTION</text>
</svg>
