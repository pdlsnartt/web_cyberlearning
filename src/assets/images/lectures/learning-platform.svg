<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Interactive learning platform</title>
  <desc id="desc">A local vector cover showing missions and code sandbox.</desc>
  <rect width="1200" height="680" fill="#081018"/>
  <rect x="90" y="70" width="1020" height="540" rx="16" fill="#111827" stroke="#ff4fd8" stroke-width="6"/>
  <rect x="130" y="120" width="280" height="420" fill="#07131f" stroke="#2a3548" stroke-width="3"/>
  <rect x="450" y="120" width="610" height="420" fill="#05080d" stroke="#18f2b2" stroke-width="3"/>
  <g font-family="Consolas,monospace" font-weight="700">
    <text x="165" y="175" fill="#18f2b2" font-size="30">MISSION LOG</text>
    <text x="165" y="240" fill="#f4f7fb" font-size="23">01 Variables</text>
    <text x="165" y="295" fill="#f4f7fb" font-size="23">02 Conditions</text>
    <text x="165" y="350" fill="#ffd166" font-size="23">03 Loops</text>
    <text x="165" y="405" fill="#f4f7fb" font-size="23">04 Sandbox</text>
    <text x="490" y="175" fill="#ff4fd8" font-size="30">RUNNER</text>
    <text x="500" y="245" fill="#18f2b2" font-size="25">&gt; build mission</text>
    <text x="500" y="300" fill="#f4f7fb" font-size="25">status: checked</text>
    <text x="500" y="355" fill="#ffd166" font-size="25">xp: +250</text>
  </g>
  <rect x="500" y="420" width="500" height="42" fill="#1a2738"/>
  <rect x="500" y="420" width="360" height="42" fill="#18f2b2"/>
  <text x="750" y="505" fill="#e8fff8" font-family="Consolas,monospace" font-size="34" text-anchor="middle">LEARN BY PLAYING</text>
</svg>
